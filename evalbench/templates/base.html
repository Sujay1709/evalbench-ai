<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="EvalBench - reproducible LLM evaluation and regression testing">
    <title>{% block title %}EvalBench{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('web.index') }}" aria-label="EvalBench home">
        <span class="brand-mark">E</span>
        <span>EvalBench</span>
      </a>
      <span class="phase-badge">Offline evaluation · Phase 1</span>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      Reproducible evaluation. Measurable decisions. No API key required.
    </footer>
  </body>
</html>
