name: Offline database compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evalbench_test_admin
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: evalbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalbench_test_admin -d evalbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVALBENCH_TEST_POSTGRES_URL: postgresql+psycopg://evalbench_test_admin:disposable-test-password@127.0.0.1:5432/evalbench_test
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: ruff check .
      - run: git diff --check
