name: Regression gate

on:
  pull_request:
    paths:
      - 'evalbench/**'
      - 'prompts/**'
      - 'datasets/**'
      - 'regression/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/regression-gate.yml'
  push:
    branches: [main]
    paths:
      - 'evalbench/**'
      - 'prompts/**'
      - 'datasets/**'
      - 'regression/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/regression-gate.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: Benchmark tier to gate
        type: choice
        options: [smoke, standard, full]
        default: standard

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      DATABASE_URL: sqlite:///${{ github.workspace }}/instance/regression-gate.db
      GATE_TIER: ${{ inputs.tier || 'standard' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Gate candidate against committed baselines
        run: >-
          python -m evalbench.cli gate --tier "$GATE_TIER"
          --json-report reports/gate.json
          --junit-report reports/gate.xml

      # A gate that never fails proves nothing. Annotations stay on so the log
      # shows the ::error line for the caught regression. The step still exits 0
      # when that regression exits 1, and exits 1 when the gate misses it.
      - name: Self-check that a known-bad prompt fails the gate
        if: success() || failure()
        run: |
          set +e
          python -m evalbench.cli gate --tier smoke \
            --candidate-prompt automotive-development=regression/fixtures/automotive_qa_missing_task.yaml \
            --json-report reports/known-bad.json \
            --junit-report reports/known-bad.xml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error title=Gate self-check::Known-bad prompt exited $status; expected 1 (regression)."
            exit 1
          fi

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-reports
          path: reports/
          if-no-files-found: warn
